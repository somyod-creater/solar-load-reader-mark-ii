<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Load Reader MK-II</title>
<!-- markers: tab-summary inputWizard embedded-load-data.js runAndShowSummary -->
</head>
<body>
<script>
(async function () {
  var TOTAL = 6;
  var parts = [];
  for (var i = 0; i < TOTAL; i++) {
    var res = await fetch("html/index-part-" + i + ".html", { cache: "no-store" });
    if (!res.ok) throw new Error("index part " + i + " HTTP " + res.status);
    parts.push(await res.text());
  }
  document.open();
  document.write(parts.join(""));
  document.close();
})().catch(function (e) {
  document.body.textContent = "Failed to load index parts: " + e;
  console.error(e);
});
</script>
</body>
</html>
