<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Load Reader MK-II</title>
<!-- markers: tab-summary inputWizard embedded-load-data.js runAndShowSummary -->
</head>
<body>
<script>
(async function () {
  async function text(url) {
    var res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(url + " HTTP " + res.status);
    return res.text();
  }
  var cssParts = [];
  for (var c = 0; c < 3; c++) {
    cssParts.push(await text("css/styles-part-" + c + ".css"));
  }
  var css = cssParts.join("");
  var htmlParts = [];
  for (var i = 0; i < 6; i++) {
    htmlParts.push(await text("html/index-part-" + i + ".html"));
  }
  var html = htmlParts.join("");
  html = html.replace(
    /<link[^>]*href=["']styles\.css[^"']*["'][^>]*>/i,
    "<style>\n" + css + "\n</style>"
  );
  document.open();
  document.write(html);
  document.close();
})().catch(function (e) {
  document.body.textContent = "Failed to load app shell: " + e;
  console.error(e);
});
</script>
</body>
</html>
